<svg width="500" height="400" viewBox="0 0 500 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Elements -->
  <circle cx="250" cy="200" r="180" fill="#F0F7FF" opacity="0.5"/>
  <circle cx="250" cy="200" r="150" fill="#E1EFFF" opacity="0.7"/>

  <!-- Credit Score Gauge Background -->
  <path d="M250 320C318.036 320 373 265.036 373 197C373 128.964 318.036 74 250 74C181.964 74 127 128.964 127 197C127 265.036 181.964 320 250 320Z" fill="white" stroke="#E0E0E0" stroke-width="2"/>

  <!-- Credit Score Gauge Colors -->
  <path d="M250 280C295.84 280 333 242.84 333 197C333 151.16 295.84 114 250 114C204.16 114 167 151.16 167 197C167 242.84 204.16 280 250 280Z" fill="white" stroke="#E0E0E0" stroke-width="2"/>

  <!-- Score Zones - Poor -->
  <path d="M250 197L250 114C221 114 195 129 180 152L250 197Z" fill="#FF7676" opacity="0.7"/>

  <!-- Score Zones - Fair -->
  <path d="M250 197L180 152C172 164 167 180 167 197L250 197Z" fill="#FFB86C" opacity="0.7"/>

  <!-- Score Zones - Good -->
  <path d="M250 197L167 197C167 214 172 230 180 242L250 197Z" fill="#FFDB4D" opacity="0.7"/>

  <!-- Score Zones - Very Good -->
  <path d="M250 197L180 242C195 265 221 280 250 280L250 197Z" fill="#83DE6E" opacity="0.7"/>

  <!-- Score Zones - Excellent -->
  <path d="M250 197L250 280C279 280 305 265 320 242L250 197Z" fill="#51D5B8" opacity="0.7"/>

  <!-- Center Circle -->
  <circle cx="250" cy="197" r="35" fill="white" stroke="#E0E0E0" stroke-width="2"/>

  <!-- Score Text -->
  <text x="250" y="190" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#161B34" font-weight="bold">790</text>
  <text x="250" y="210" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#51D5B8">Excellent</text>

  <!-- Needle -->
  <line x1="250" y1="197" x2="300" y2="147" stroke="#161B34" stroke-width="3" stroke-linecap="round"/>
  <circle cx="250" cy="197" r="5" fill="#161B34"/>

  <!-- Score Label Texts -->
  <text x="175" y="130" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#FF7676">Poor</text>
  <text x="155" y="197" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#FFB86C">Fair</text>
  <text x="175" y="270" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#FFDB4D">Good</text>
  <text x="250" y="290" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#83DE6E">Very Good</text>
  <text x="325" y="270" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#51D5B8">Excellent</text>

  <!-- Person Icons -->
  <g transform="translate(50, 180)">
    <!-- Person 1 -->
    <circle cx="20" cy="20" r="15" fill="#51D5B8"/>
    <circle cx="20" cy="15" r="5" fill="#FFFFFF"/>
    <path d="M10 35C10 27 15 25 20 25C25 25 30 27 30 35" fill="#51D5B8"/>

    <!-- Phone/Report -->
    <rect x="40" y="10" width="20" height="30" rx="2" fill="#FFFFFF" stroke="#51D5B8" stroke-width="2"/>
    <line x1="45" y1="15" x2="55" y2="15" stroke="#51D5B8" stroke-width="1"/>
    <line x1="45" y1="20" x2="55" y2="20" stroke="#51D5B8" stroke-width="1"/>
    <line x1="45" y1="25" x2="50" y2="25" stroke="#51D5B8" stroke-width="1"/>
  </g>

  <g transform="translate(380, 180)">
    <!-- Person 2 -->
    <circle cx="20" cy="20" r="15" fill="#91CBDE"/>
    <circle cx="20" cy="15" r="5" fill="#FFFFFF"/>
    <path d="M10 35C10 27 15 25 20 25C25 25 30 27 30 35" fill="#91CBDE"/>

    <!-- Computer/Report -->
    <rect x="-30" y="10" width="35" height="25" rx="2" fill="#FFFFFF" stroke="#91CBDE" stroke-width="2"/>
    <rect x="-20" y="35" width="15" height="5" rx="1" fill="#FFFFFF" stroke="#91CBDE" stroke-width="2"/>
    <line x1="-25" y1="15" x2="-5" y2="15" stroke="#91CBDE" stroke-width="1"/>
    <line x1="-25" y1="20" x2="-5" y2="20" stroke="#91CBDE" stroke-width="1"/>
    <line x1="-25" y1="25" x2="-15" y2="25" stroke="#91CBDE" stroke-width="1"/>
  </g>

  <!-- Bottom Graphic Elements - Money/Finance -->
  <g transform="translate(130, 330)">
    <rect x="0" y="0" width="40" height="25" rx="3" fill="#51D5B8" opacity="0.7"/>
    <line x1="5" y1="7" x2="35" y2="7" stroke="white" stroke-width="2"/>
    <line x1="5" y1="12" x2="35" y2="12" stroke="white" stroke-width="2"/>
    <line x1="5" y1="17" x2="25" y2="17" stroke="white" stroke-width="2"/>
  </g>

  <g transform="translate(260, 330)">
    <circle cx="20" cy="15" r="15" fill="#91CBDE" opacity="0.7"/>
    <text x="20" y="20" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white" font-weight="bold">₹</text>
  </g>

  <g transform="translate(330, 330)">
    <rect x="0" y="0" width="30" height="30" rx="3" fill="#DCB442" opacity="0.7"/>
    <line x1="7" y1="10" x2="23" y2="10" stroke="white" stroke-width="2"/>
    <line x1="7" y1="15" x2="23" y2="15" stroke="white" stroke-width="2"/>
    <line x1="7" y1="20" x2="23" y2="20" stroke="white" stroke-width="2"/>
  </g>
</svg>
